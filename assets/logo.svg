<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Handheld Forge</title>
  <desc id="desc">Original lit-screen handheld console icon for the Handheld Forge Cursor plugin. No third-party trademarks.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#EA580C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- App tile -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect width="256" height="256" rx="52" fill="url(#glow)"/>
  <!-- Handheld body -->
  <rect x="58" y="28" width="140" height="200" rx="28" fill="url(#bezel)" stroke="#78716C" stroke-width="3"/>
  <!-- Lit screen bezel -->
  <rect x="74" y="48" width="108" height="88" rx="12" fill="#0C0A09" stroke="#FDBA74" stroke-width="3" filter="url(#softGlow)"/>
  <!-- Glowing screen -->
  <rect x="82" y="56" width="92" height="72" rx="8" fill="url(#screen)"/>
  <!-- Tiny pixel scene on screen: pier lamps -->
  <rect x="92" y="98" width="72" height="6" rx="2" fill="#9A3412" opacity="0.85"/>
  <circle cx="104" cy="88" r="5" fill="#FFF7ED"/>
  <circle cx="128" cy="82" r="6" fill="#FFEDD5"/>
  <circle cx="152" cy="88" r="5" fill="#FFF7ED"/>
  <rect x="102" y="88" width="4" height="12" fill="#7C2D12"/>
  <rect x="126" y="82" width="4" height="18" fill="#7C2D12"/>
  <rect x="150" y="88" width="4" height="12" fill="#7C2D12"/>
  <!-- Cross + buttons -->
  <g transform="translate(0,8)">
    <rect x="84" y="158" width="36" height="12" rx="4" fill="#D6D3D1"/>
    <rect x="96" y="146" width="12" height="36" rx="4" fill="#D6D3D1"/>
    <circle cx="156" cy="158" r="9" fill="#FB923C"/>
    <circle cx="172" cy="174" r="9" fill="#FDBA74"/>
    <circle cx="140" cy="174" r="9" fill="#EA580C"/>
  </g>
  <!-- Speaker dots -->
  <circle cx="128" cy="214" r="2.5" fill="#A8A29E"/>
  <circle cx="140" cy="214" r="2.5" fill="#A8A29E"/>
  <circle cx="116" cy="214" r="2.5" fill="#A8A29E"/>
</svg>
